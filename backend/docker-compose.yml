services:
  postgres:
    image: postgres:16-alpine
    container_name: shifter-postgres
    environment:
      POSTGRES_USER: shifter
      POSTGRES_PASSWORD: shifter123
      POSTGRES_DB: shifter
    ports:
      - "5432:5432"
    volumes:
      - shifter_pg_data:/var/lib/postgresql/data

volumes:
  shifter_pg_data:
